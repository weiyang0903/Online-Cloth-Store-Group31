<style>

        background-size: cover;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        /* 意思是在电脑可见的范围，也就是你电脑有多高他就多高 */
        height: 100vh;
    }
    .background
    {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        filter: blur(5px);
        z-index: -1;
    }
    .wel
    {
        width: 550px;
        height: 500px;
        background-color: white;
        border-radius: 50px;
        display: flex;
        position: relative;
        border: 1px black;
        box-shadow: 0 0 5px black;
    }
    img
    {
        margin: 0 auto;
        height: 200px;
        width: 200px;
    }
    .desc
    {
        position: absolute;
        top: 45%;
        width: 100%;
        background-color: #f8f8f8;
    }
    p{
        text-transform: uppercase;
        text-align: center;
    }
    .word
    {
        font-weight: 900;
        font-size: 30px;
    }
    .button
    {
        display: flex;
        position: absolute;
        width: 100%;
        /* 每一次在使用center时都要给他定一个高度或者宽度 */
        justify-content: center;
        text-align: center;
        top: 80%;
        gap: 40px;
    }
    .button a
    {
        height: 40px;
        width: 110px;
        padding-top: 20px;
        text-decoration: none;
        font-size: 20px;
        font-weight: 800;
        color: white;
        cursor: pointer;

    }

    }
